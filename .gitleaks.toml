title = "Poker Playbook gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '''sk-ant-api[0-9]{2}-[A-Za-z0-9_\-]{40,}'''
keywords = ["sk-ant-api"]

[[rules]]
id = "supabase-secret-key"
description = "Supabase sb_secret_* key"
regex = '''sb_secret_[A-Za-z0-9_]{30,}'''
keywords = ["sb_secret_"]

[[rules]]
id = "supabase-jwt-legacy"
description = "Supabase legacy JWT (anon/service_role/HS256)"
regex = '''eyJhbGciOi[A-Za-z0-9_\-]{20,}\.[A-Za-z0-9_\-]{40,}\.[A-Za-z0-9_\-]{20,}'''
keywords = ["eyJhbGciOi"]

[[rules]]
id = "github-pat-classic"
description = "GitHub PAT classic"
regex = '''ghp_[A-Za-z0-9]{36}'''
keywords = ["ghp_"]

[[rules]]
id = "github-pat-fine"
description = "GitHub PAT fine-grained"
regex = '''github_pat_[A-Za-z0-9_]{36,}'''
keywords = ["github_pat_"]

[[rules]]
id = "stripe-live-key"
description = "Stripe live key"
regex = '''sk_live_[A-Za-z0-9]{24,}'''
keywords = ["sk_live_"]

[[rules]]
id = "resend-api-key"
description = "Resend API key"
regex = '''re_[A-Za-z0-9_]{20,}'''
keywords = ["re_"]

[[rules]]
id = "airtable-pat"
description = "Airtable PAT"
regex = '''pat[A-Za-z0-9]{14,17}\.[A-Za-z0-9]{60,}'''
keywords = ["pat"]

[allowlist]
description = "Allowlist: paths (docs/tests/fixtures), public-by-design keys, env var name references"
paths = [
  '''.*\.md$''',
  '''.*test.*''',
  '''.*fixture.*''',
  '''.*example.*''',
  '''.*\.lock$''',
  '''package-lock\.json''',
]
regexes = [
  '''sb_publishable_[A-Za-z0-9_]+''',
  '''TURNSTILE_SITEKEY''',
  '''Deno\.env\.get\(["'][A-Z_]+["']\)''',
  '''process\.env\.[A-Z_]+''',
  '''ANTHROPIC_API_KEY''',
  '''SUPABASE_(URL|ANON_KEY|SERVICE_ROLE_KEY|PUBLISHABLE_KEY)''',
  '''claude-(opus|sonnet|haiku)-[0-9](-[0-9])?(-[a-z0-9]+)?''',
  '''[a-z_]+_(pkey|fkey|key|idx|check|unique|dedupe_key)''',
]
